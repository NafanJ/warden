[project]
name = "warden"
version = "0.1.0"
description = "Self-healing infrastructure agent: monitors a Docker media server, diagnoses incidents with the Claude Agent SDK, and heals it under tiered human-approval permissions."
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "openai>=1.40",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "websockets>=13.0",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain-ollama>=1,<2",
    "sqlite-vec>=0.1.6,<0.2",
    "pypdf>=6,<7",
    "pwdlib[argon2]>=0.2,<1",
    "jsonschema>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.12"]

[tool.setuptools.packages.find]
include = ["warden*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
